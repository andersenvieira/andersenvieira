name: Cobrinha e cartão de contribuições

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Cartão de contribuições com o nome inteiro
        run: |
          curl -sfL "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=andersenvieira&theme=tokyonight" -o dist/card.svg
          sed -i 's#andersenvieira (Ande…)#Andersen Vieira#' dist/card.svg
          grep -q 'Andersen Vieira' dist/card.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
